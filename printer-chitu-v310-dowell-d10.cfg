# ==============================================================================
# Конфигурация Klipper для Dowell D10 1000x1000x1000
# Материнская плата: Chitu V3.10 (STM32F103ZET6)
# Основано на проверенных GPIO из Marlin pins_CHITU3D_common.h / V6 / V9
# и официальных конфигах Klipper для Tronxy X5SA (Chitu V6)
#
# МЕХАНИКА:
#   X:  1 мотор, ремень GT2
#   Y:  1 мотор, ремень GT2
#   Z:  4 мотора на внешних драйверах, параллельное подключение
#   E:  1 экструдер BMG
#
# РАСПИНОВКА (проверено на плате):
#   X- (X_MIN)  -> PG10  (механический концевик)
#   X+ (X_MAX)  -> PG9   (резерв / механический концевик)
#   Y- (Y_MIN)  -> PA12  (механический концевик)
#   Z- (Z_MIN)  -> PA14  (3D Touch / BLTouch sensor)
#   ERROR       -> PG4   (3D Touch / BLTouch servo control)
#   SIGNAL      -> PG2   (кнопка включения / автоотключение)
#   FILAMENT    -> PA15  (датчик филамента)
#
# ВАЖНО: Плата использует загрузчик Chitu. Прошивка собирается с параметрами:
#   - MCU: STM32F103
#   - Смещение загрузчика: 0x8008800
#   - Связь: USART1 (PA10/PA9)
#   - Генерация update.cbd: ./scripts/update_chitu.py ./out/klipper.bin ./out/update.cbd
# ==============================================================================

# ==============================================================================
# 1. MCU
# ==============================================================================
[mcu]
serial: /dev/ttyUSB0
# ^^^ Укажите здесь реальный порт (смотрите через ls /dev/serial/by-id/)
restart_method: command

# ==============================================================================
# 2. Кинематика и лимиты принтера
# ==============================================================================
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1500
max_z_velocity: 25
max_z_accel: 30

# ==============================================================================
# 3. Шаговик X (ремень GT2)
# ==============================================================================
[stepper_x]
step_pin: PE5
dir_pin: !PE6
enable_pin: !PC13
microsteps: 16
# Ремень GT2 со шкивом 20T: 20 зубьев * 2 мм = 40 мм на оборот
# Если у вас шкив с другим количеством зубьев, скорректируйте:
#   16T -> 32 мм, 20T -> 40 мм
rotation_distance: 40
# Калибровка: поставьте метку, выполните G1 X100 F1000, измерьте фактическое
# перемещение штангенциркулем:
#   новое_rotation_distance = старое * (фактическое_мм / 100)
endstop_pin: !PG10
position_endstop: 0
position_min: 0
position_max: 1000
homing_speed: 50
homing_retract_dist: 10
second_homing_speed: 10.0

# ==============================================================================
# 4. Шаговик Y (ремень GT2)
# ==============================================================================
[stepper_y]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PE4
microsteps: 16
# Откалибровано 2026-08-19: фактический шаг Y = 20 мм/оборот
rotation_distance: 20
endstop_pin: !PA12
position_endstop: 0
position_min: 0
position_max: 1000
homing_speed: 50.0
homing_retract_dist: 10
second_homing_speed: 10.0

# ==============================================================================
# 5. Шаговик Z (ШВП, 4 мотора на внешних драйверах параллельно)
# ==============================================================================
[stepper_z]
step_pin: PB9
dir_pin: PE0
enable_pin: !PE1
# Внешний драйвер настроен на 4 microsteps (800 pulse/rev).
# Для корректной работы microsteps в Klipper должно совпадать с настройкой драйвера.
microsteps: 4
# Шаг ШВП (lead) — расстояние за 1 оборот мотора.
# Откалибровано 2026-08-19: фактический шаг Z = 1.333 мм/оборот
rotation_distance: 1.333
# 3D Touch используется как виртуальный концевик:
endstop_pin: probe:z_virtual_endstop
position_max: 1000
position_min: -2

# ==============================================================================
# 6. Экструдер (BMG)
# ==============================================================================
[extruder]
step_pin: PB4
dir_pin: PB5
enable_pin: !PB8
microsteps: 16
# Передаточное число BMG (Bondtech) = 50:17 (~2.94:1)
# Калибровка rotation_distance:
#   1. Отметьте филамент на 120 мм над экструдером
#   2. Экструдируйте 100 мм: G1 E100 F300
#   3. Измерьте оставшееся расстояние (например, 28 мм -> экструдировано 92 мм)
#   4. Новое rotation_distance = старое * (фактическое / запрошенное)
#      Пример: 22.4 * (92 / 100) = 20.6
rotation_distance: 22.4
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PG12
sensor_type: ATC Semitec 104GT-2
sensor_pin: PA1
control: pid
pid_Kp: 18.831
pid_Ki: 0.821
pid_Kd: 108.044
min_temp: 0
max_temp: 260
max_extrude_only_distance: 300
# Pressure Advance — компенсация давления в сопле на углах.
# Значение ~0.04 — отправная точка; откалибруйте методом tower:
# https://www.klipper3d.org/Pressure_Advance.html
pressure_advance: 0.040
pressure_advance_smooth_time: 0.040

# ==============================================================================
# 7. Нагревательный стол
# ==============================================================================
[heater_bed]
heater_pin: PG11
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 73.932
pid_Ki: 1.521
pid_Kd: 898.279
min_temp: 0
max_temp: 130

# ==============================================================================
# 8. Вентиляторы
# ==============================================================================
[heater_fan hotend_fan]
pin: PG14
heater: extruder
heater_temp: 50.0

[fan]
pin: PG13

[controller_fan drivers_fan]
pin: PD6

# ==============================================================================
# 9. Датчик филамента
# ==============================================================================
[filament_switch_sensor filament_sensor]
pause_on_runout: True
runout_gcode: M25
switch_pin: !PA15

# ==============================================================================
# 10. Зуммер
# ==============================================================================
[output_pin beeper]
pin: PB0

# ==============================================================================
# 11. Управление питанием (порт SIGNAL)
# ==============================================================================
# Порт SIGNAL (PG2) используется для кнопки включения и автоотключения при простое.
# Раскомментируйте, если хотите, чтобы Klipper управлял БП:
#[output_pin psu_control]
#pin: PG2
#value: 0
#shutdown_value: 0

# ==============================================================================
# 12. Z-Probe (3D Touch / BLTouch с автовыдвижением щупа)
# ==============================================================================
# Подключение 3D Touch на плате Chitu V3.10:
#   - Сенсор (2 провода, сигнал + GND)  -> разъём Z- (Z_MIN), пин PA14
#   - Servo (3 провода, PWM + 5V + GND) -> разъём ERROR, пин PG4
#
# Если щуп не выдвигается/убирается автоматически:
#   1. Проверьте подключение питания 5V и GND на разъёме ERROR
#   2. Выполните BLTOUCH_DEBUG COMMAND=pin_down — щуп должен выдвинуться
#   3. Выполните BLTOUCH_DEBUG COMMAND=pin_up — щуп должен убраться
#   4. Если не работает, возможно потребуется программный PWM (см. документацию Klipper)

[bltouch]
sensor_pin: ^PA14
control_pin: PG4
x_offset: 0
y_offset: 0
z_offset: 2.0
speed: 30
pin_move_time: 0.500
stow_on_each_sample: False
# Для некоторых клонов BLTouch/3D Touch раскомментируйте:
# probe_with_touch_mode: True

# ==============================================================================
# 13. Безопасный home Z / Сетка стола
# ==============================================================================
[safe_z_home]
home_xy_position: 500, 500
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 50
# Для стола 1000x1000 мм 7x7 или 9x9 даёт хорошее разрешение.
probe_count: 7, 7
# Бикубическая интерполяция лучше лагранжевой для больших столов.
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
# Область сетки: оставьте ~50 мм отступа от краёв на больших принтерах.
mesh_min: 50, 50
mesh_max: 950, 950
horizontal_move_z: 5

# ==============================================================================
# 14. Input Shaper (гасление резонанса)
# ==============================================================================
# Input Shaper снижает "призраки" (ringing) на высоких скоростях.
# Для большого принтера значения нужно подбирать индивидуально!
# Методы калибровки:
#   1) С акселерометром: ADXL345 / LIS2DW + команда SHAPER_CALIBRATE
#   2) Вручную: печать tower'ов с разными частотами
#   3) Приблизительно: начните с 40-60 Гц для ремней GT2.
#
# После калибровки обновите значения ниже и перезагрузите:
[input_shaper]
shaper_freq_x: 50.0
shaper_freq_y: 50.0
shaper_type: mzv
# Альтернативные типы: zv, mzv, zvd, ei, 2hump_ei, 3hump_ei
# mzv — оптимальный баланс между сглаживанием и допустимым ускорением.

# ==============================================================================
# 15. Исключение объектов (Exclude Object)
# ==============================================================================
# Позволяет пропускать отдельные объекты на столе во время печати.
# В Orca Slicer включите: Настройки принтера -> Дополнительно -> Label objects
[exclude_object]

# ==============================================================================
# 16. Макросы (оптимизированы для Orca Slicer)
# ==============================================================================

# --- Pause/Resume базовый модуль ---
[pause_resume]

# --- Начало и окончание печати ---
[gcode_macro START_PRINT]
gcode:
    # Orca Slicer передаёт параметры автоматически через placeholders
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M104 S{EXTRUDER_TEMP}      ; Начать нагрев сопла
    M140 S{BED_TEMP}           ; Начать нагрев стола
    M190 S{BED_TEMP}           ; Ждать нагрев стола
    M109 S{EXTRUDER_TEMP}      ; Ждать нагрев сопла
    G28                        ; Home все оси
    G1 Z5 F3000                ; Приподнять сопло
    M300 S1000 P200            ; Короткий сигнал готовности

description: Начало печати. Ожидает нагрева, выполняет home.

[gcode_macro END_PRINT]
gcode:
    M104 S0                    ; Выключить нагрев сопла
    M140 S0                    ; Выключить нагрев стола
    G91                        ; Относительные координаты
    G1 E-2 F2700               ; Ретракт
    G1 Z10 F3000               ; Опустить стол / поднять каретку
    G90                        ; Абсолютные координаты
    G1 X0 Y{printer.toolhead.axis_maximum.y} F3000  ; Вывести стол вперёд
    M84                        ; Выключить моторы
    M300 S1000 P500            ; Сигнал окончания

description: Окончание печати. Охлаждение, парковка, выключение моторов.

# --- Пауза, продолжение, отмена ---
[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
    {% set X = params.X|default(10)|float %}
    {% set Y = params.Y|default(10)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    PAUSE_BASE
    G91
    G1 E-2 F2700
    G1 Z{Z} F3000
    G90
    G1 X{X} Y{Y} F3000

description: Пауза печати с ретрактом и отводом в угол.

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    RESTORE_GCODE_STATE NAME=PAUSE_state
    RESUME_BASE

description: Продолжение печати после паузы.

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    G91
    G1 E-2 F2700
    G1 Z10 F3000
    G90
    G28 X Y
    M104 S0
    M140 S0
    M84
    CANCEL_PRINT_BASE

description: Отмена печати с парковкой и выключением нагрева.

# --- Совместимость с G-code слайсеров ---
[gcode_macro M104]
rename_existing: M104.1
gcode:
    {% set S = params.S|default(0)|float %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={S}

description: Установка температуры сопла (совместимость).

[gcode_macro M109]
rename_existing: M109.1
gcode:
    {% set S = params.S|default(0)|float %}
    M104 S{S}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={S}

description: Установка температуры сопла с ожиданием (совместимость).

[gcode_macro M140]
rename_existing: M140.1
gcode:
    {% set S = params.S|default(0)|float %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={S}

description: Установка температуры стола (совместимость).

[gcode_macro M190]
rename_existing: M190.1
gcode:
    {% set S = params.S|default(0)|float %}
    M140 S{S}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={S}

description: Установка температуры стола с ожиданием (совместимость).

[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=1
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0

description: Воспроизведение звукового сигнала (частота S, длительность P в мс).

[gcode_macro M600]
gcode:
    PAUSE
    M109 S{printer.extruder.target}  ; Поддерживать температуру
    G1 X10 Y10 F3000
    M300 S1000 P200

description: Смена филамента (M600).

[gcode_macro LOAD_FILAMENT]
gcode:
    M83                        ; Относительный режим экструдера
    G1 E100 F300               ; Медленная подача 100 мм
    G1 E50 F150                ; Медленная дозаправка
    M82                        ; Возврат в абсолютный режим

description: Загрузка филамента.

[gcode_macro UNLOAD_FILAMENT]
gcode:
    M83                        ; Относительный режим экструдера
    G1 E20 F300                ; Небольшая подача
    G1 E-80 F1500              ; Быстрый вытяг
    M82                        ; Возврат в абсолютный режим

description: Выгрузка филамента.

[gcode_macro G29]
gcode:
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=default

description: Автоматическое построение сетки стола (аналог G29 Marlin).

[gcode_macro M48]
gcode:
    PROBE_ACCURACY

description: Проверка точности зонда (аналог M48 Marlin).

# --- Утилиты ---
[gcode_macro PARK]
gcode:
    G28
    G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} Z50 F3000

description: Парковка в центр стола на высоте 50 мм.

[gcode_macro HOME_XY]
gcode:
    G28 X Y

description: Home только X и Y.

[gcode_macro TEST_PROBE]
gcode:
    G28
    PROBE
    QUERY_PROBE
    GET_POSITION

description: Тест зонда: home, затем одиночное касание.

[gcode_macro TEST_BLTOUCH]
gcode:
    M300 S1000 P200
    BLTOUCH_DEBUG COMMAND=pin_down
    G4 P1000
    BLTOUCH_DEBUG COMMAND=pin_up
    G4 P1000
    BLTOUCH_DEBUG COMMAND=touch_mode
    M300 S1000 P200

description: Тест 3D Touch: выдвижение/убирание щупа.

[gcode_macro PID_HOTEND]
gcode:
    PID_CALIBRATE HEATER=extruder TARGET=200
    SAVE_CONFIG

description: Калибровка PID экструдера на 200°C и сохранение.

[gcode_macro PID_BED]
gcode:
    PID_CALIBRATE HEATER=heater_bed TARGET=60
    SAVE_CONFIG

description: Калибровка PID стола на 60°C и сохранение.

# ==============================================================================
# 17. Справка по GPIO пинам платы Chitu V3.10 (проверено на данном принтере)
# ==============================================================================
# Концевики:
#   X- (X_MIN):  PG10  (механический концевик)
#   X+ (X_MAX):  PG9   (резерв / механический концевик)
#   Y- (Y_MIN):  PA12  (механический концевик)
#   Z- (Z_MIN):  PA14  (3D Touch / BLTouch sensor)
#
# 3D Touch / BLTouch (полноценный, с servo):
#   sensor_pin:  ^PA14  (разъём Z-, сигнал + GND)
#   control_pin: PG4    (разъём ERROR, PWM + 5V + GND)
#
# Остальные пины:
#   SIGNAL (кнопка питания / автоотключение):  PG2
#   FILAMENT (датчик филамента):               PA15
#   LED выход (если подключён):                PD3
#   SPI Flash (W25Q):                          CS=PB12, SCK=PB13, MISO=PB14, MOSI=PB15
#   Сенсорный экран (SPI1):                    CS=PB7, SCK=PA5, MISO=PA6, MOSI=PA7
#   TFT FSMC:                                  CS=PD7, RS=PD11, RESET=PF11, BACKLIGHT=PD13
#   SDIO SD-карта (на плате):                  CLK, CMD, D0-D3 (native SDIO, не SPI)
# ==============================================================================
